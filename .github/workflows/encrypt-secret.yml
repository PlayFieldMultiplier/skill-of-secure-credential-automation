name: Encrypt Secret for Local Rotation

on:
  push:
    paths:
      - .github/workflows/encrypt-secret.yml
  workflow_dispatch:

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Encrypt secret
        env:
          SECRET_TO_ENCRYPT: ${{ secrets.YOUR_SECRET_NAME }}
          CLAUDE_PUBKEY: age1q7qfflv2uphagg2c2g37e6dw9430s7rer36qrkl7huzvuuyk6dgsgrp3jg
        run: |
          echo -n "$SECRET_TO_ENCRYPT" | age -r "$CLAUDE_PUBKEY" > encrypted.txt
          echo "✓ Encrypted"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-credential
          path: encrypted.txt
          retention-days: 1
